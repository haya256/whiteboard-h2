<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>openboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <span class="app-title">openboard</span>
    <button id="btn-add-sticky">+ 付箋</button>
    <button id="btn-add-rect">□ 矩形</button>
    <button id="btn-add-ellipse">○ 楕円</button>
    <button id="btn-add-diamond">◇ ひし形</button>
    <button id="btn-connector">→ コネクタ</button>
    <label class="toolbar-btn" id="btn-image-label">
      🖼 画像
      <input type="file" id="btn-image" accept="image/*" multiple>
    </label>
    <div class="toolbar-sep"></div>
    <button id="btn-undo" title="元に戻す (Ctrl+Z)">↶ 元に戻す</button>
    <button id="btn-redo" title="やり直す (Ctrl+Shift+Z / Ctrl+Y)">↷ やり直す</button>
    <button id="btn-export">保存 (.svg)</button>
    <label class="toolbar-btn" id="btn-import-label">
      開く (.svg)
      <input type="file" id="btn-import" accept=".svg">
    </label>
    <span id="zoom-label">100%</span>
    <button id="btn-zoom-fit" title="全ノードが収まるように表示">⛶ 全体表示</button>
    <button id="btn-zoom-reset" title="表示位置とズームをリセット">⟲ リセット</button>
  </div>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>

  <script src="src/model.js"></script>
  <script src="src/view.js"></script>
  <script src="src/io.js"></script>
  <script src="src/history.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
